services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MAX_UPLOAD_MB=25
      - OCR_DPI=300
      - OCR_LANGS=eng
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
