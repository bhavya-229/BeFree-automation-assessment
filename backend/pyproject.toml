[project]
name = "bank-statement-processor"
version = "1.0.0"
description = "Privacy-Centric Bank Statement Processing & Classification System (Australia & UK MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
    "pikepdf>=8.14.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "rapidfuzz>=3.6.0",
    "python-dateutil>=2.9.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "xlsxwriter>=3.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
]
